name: Scala Steward

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scala-steward:
    runs-on: ubuntu-latest

    steps:
      - name: Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.SCALA_STEWARD_TOKEN }}
